<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Donate an item | Neighbourhood Reuse</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/theme.css"><script src="js/api.js" defer></script><script src="js/main.js" defer></script><script src="js/post-item.js" defer></script></head>
<body><header class="site-header"><a class="brand" href="index.html">♻ Neighbourhood Reuse</a><nav><a href="browse.html">Browse items</a><a href="dashboard.html">Dashboard</a><span id="nav-auth"></span></nav></header>
<main class="form-page wide"><section class="form-card"><p class="eyebrow">Pass it forward</p><h1>Post a donation</h1><p class="muted">Items are given away for free. Do not post anything unsafe or unusable.</p>
<form id="post-item-form"><label>Item title<input name="title" required maxlength="150" placeholder="e.g. School textbooks"></label><label>Description<textarea name="description" required rows="4" placeholder="Describe the item and any important details"></textarea></label><div class="two-col"><label>Category<select name="category" required><option value="">Choose category</option><option>Clothing</option><option>Books</option><option>Electronics</option><option>Furniture</option><option>Household</option><option>Toys</option><option>Other</option></select></label><label>Condition<select name="item_condition" required><option>Good</option><option>New</option><option>Like New</option><option>Fair</option></select></label></div><label>Approximate location<input name="location" required maxlength="200" placeholder="e.g. neighbourhood or public meeting point"></label><label>Image URL (optional)<input name="image_url" type="url" placeholder="Paste a publicly accessible image URL"></label><button class="button full" type="submit">Publish donation</button><p id="form-message" class="form-message" role="status"></p></form></section></main><footer class="site-footer">Thank you for helping reduce waste.</footer></body></html>
