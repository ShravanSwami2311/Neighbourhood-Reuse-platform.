<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My dashboard | Neighbourhood Reuse</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/theme.css"><script src="js/config.js" defer></script><script src="js/api.js" defer></script><script src="js/main.js" defer></script><script src="js/dashboard.js" defer></script></head>

<section class="dashboard-section"><h2>Requests for my items</h2><div id="received-requests" class="request-list"></div></section></main><footer class="site-footer">Thank you for keeping useful items in use.</footer></body></html>
