<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account | Neighbourhood Reuse</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/theme.css"><script src="js/config.js" defer></script><script src="js/api.js" defer></script><script src="js/main.js" defer></script><script src="js/auth.js" defer></script></head>
<body><header class="site-header"><a class="brand" href="index.html">♻ Neighbourhood Reuse</a><nav><a href="browse.html">Browse items</a><a href="login.html">Log in</a></nav></header>
<main class="form-page"><section class="form-card"><p class="eyebrow">Join your community</p><h1>Create account</h1><p class="muted">A free account lets you share items and contact donors.</p>
<form id="register-form"><label>Full name<input name="name" required maxlength="100" autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" required minlength="8" autocomplete="new-password"><small>Use at least 8 characters.</small></label><label>Phone (optional)<input name="phone" type="tel" autocomplete="tel"></label><label>Neighbourhood / area<input name="area" maxlength="150" placeholder="e.g. your local area"></label><button class="button full" type="submit">Create account</button><p id="form-message" class="form-message" role="status"></p></form><p>Already registered? <a href="login.html">Log in</a></p></section></main><footer class="site-footer">Your community, connected.</footer></body></html>
